name: Build and Release

on:
  push:
    branches:
      - Release

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install build dependencies
        run: |
          # Ensure Xcode command line tools are available
          xcode-select --install 2>/dev/null || true
      
      - name: Build CLI for Apple Silicon (arm64)
        run: |
          make clean || true
          CFLAGS="-target arm64-apple-macos11" make
          mv dynaserve dynaserve-arm64
      
      - name: Build CLI for Intel (x86_64)
        run: |
          make clean
          CFLAGS="-target x86_64-apple-macos10.13" make
          mv dynaserve dynaserve-x86_64
      
      - name: Verify binaries
        run: |
          echo "=== Apple Silicon Binary ==="
          file dynaserve-arm64
          ls -lh dynaserve-arm64
          echo ""
          echo "=== Intel Binary ==="
          file dynaserve-x86_64
          ls -lh dynaserve-x86_64
      
      - name: Determine version bump
        id: version_bump
        run: |
          # Get the latest tag, default to 0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Parse version numbers
          IFS='.' read -r -a VERSION <<< "${LATEST_TAG#v}"
          MAJOR="${VERSION[0]:-0}"
          MINOR="${VERSION[1]:-0}"
          PATCH="${VERSION[2]:-0}"
          
          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Determine version bump based on commit message
          if echo "$COMMIT_MSG" | grep -iq "Release: Major"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="Major"
          elif echo "$COMMIT_MSG" | grep -iq "Release: Minor"; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="Minor"
          elif echo "$COMMIT_MSG" | grep -iq "Release: Patch"; then
            PATCH=$((PATCH + 1))
            BUMP_TYPE="Patch"
          else
            # Default to patch if no keyword found
            PATCH=$((PATCH + 1))
            BUMP_TYPE="Patch (default)"
          fi
          
          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG (${BUMP_TYPE} bump)"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version_bump.outputs.new_tag }}
          name: Release ${{ steps.version_bump.outputs.new_tag }}
          body: |
            ## Release ${{ steps.version_bump.outputs.new_tag }}
            
            **Version Bump:** ${{ steps.version_bump.outputs.bump_type }}
            
            ### Installation
            
            **Apple Silicon (M1/M2/M3/M4):**
            ```bash
            curl -L -o dynaserve https://github.com/${{ github.repository }}/releases/download/${{ steps.version_bump.outputs.new_tag }}/dynaserve-arm64
            chmod +x dynaserve
            sudo mv dynaserve /usr/local/bin/
            ```
            
            **Intel Mac:**
            ```bash
            curl -L -o dynaserve https://github.com/${{ github.repository }}/releases/download/${{ steps.version_bump.outputs.new_tag }}/dynaserve-x86_64
            chmod +x dynaserve
            sudo mv dynaserve /usr/local/bin/
            ```
            
            ### Changes in this release
            - Auto-generated release from commit ${{ github.sha }}
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.version_bump.outputs.latest_tag }}...${{ steps.version_bump.outputs.new_tag }}
          draft: false
          prerelease: false
          files: |
            dynaserve-arm64
            dynaserve-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}